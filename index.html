<!DOCTYPE html>
<head>
  <title>Our Solar System</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    body {
        margin: 0;
        background-color: #000055;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
</style>
</head>

<body>
<div id="container"></div>

<script>

  console.log(d3); // test if d3 is loaded

  const width = 1400;
  const height = 700;

  const svg = d3.select("#container")
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .style("background", "#000055"); // same as background color ***TODO

  // earth orbit
  const earth_x = width / 2;   // center of the circle
  const earth_y = height / 2;
  const earth_orbit_radius = 230;

  // orbit ring
  svg.append("circle")
      .attr("cx", width/2)
      .attr("cy", height/2)
      .attr("r", earth_orbit_radius)
      .attr("stroke", "white")
      .attr("fill", "none");
  
  function drawEarth() {
    let earth = svg.append("g");

    earth = svg.append("circle")
                  .attr("r", 40)
                  .attr("fill", "#009900")
                  .on("mouseover", function () {
                    svg.append("text")
                      .attr("id", "earth-label")
                      .attr("x", 150)
                      .attr("y", 350)
                      .attr("text-anchor", "middle")
                      .attr("font-size", "24px")
                      .attr("fill", "white")
                      .text("Earth");
                  })
                  .on("mouseout", function () {
                    svg.select("#earth-label").remove();
                  });
    
    // earth = svg.append("rect")
    //               .attr("x", 385)
    //               .attr("y", 370)
    //               .attr("width", 30)
    //               .attr("height", 50)
    //               .attr("fill", "#8D5524");

    return earth;
  }
  const earth = drawEarth()

  function earthOrbit() {
      const duration = 20000; // 20 seconds

      earth.transition()
            .duration(duration)
            .ease(d3.easeLinear)
            .attrTween("cx", function() {
              return function(t) {
                return earth_x + earth_orbit_radius * Math.cos(2 * Math.PI * t);
              }
            })
            .attrTween("cy", function() {
              return function(t) {
                return earth_y + earth_orbit_radius * Math.sin(2 * Math.PI * t);
              }
            })
            .on("end", earthOrbit); // repeat infinitely
    }
  earthOrbit();


  // mars orbit
  const mars_x = width / 2;   // center of the circle
  const mars_y = height / 2;
  const mars_orbit_radius = 320;

  // orbit ring
  svg.append("circle")
      .attr("cx", width/2)
      .attr("cy", height/2)
      .attr("r", mars_orbit_radius)
      .attr("stroke", "white")
      .attr("fill", "none");
  
  function drawMars() {
    let mars = svg.append("g");

    mars = svg.append("circle")
                  .attr("r", 20)
                  .attr("fill", "#b30000")
                  .on("mouseover", function () {
                    svg.append("text")
                      .attr("id", "mars-label")
                      .attr("x", 150)
                      .attr("y", 350)
                      .attr("text-anchor", "middle")
                      .attr("font-size", "24px")
                      .attr("fill", "white")
                      .text("Mars");
                  })
                  .on("mouseout", function () {
                    svg.select("#mars-label").remove();
                  });
  
    return mars;
  }
  const mars = drawMars()

  function marsOrbit() {
      const duration = 40000; // 20 seconds

      mars.transition()
            .duration(duration)
            .ease(d3.easeLinear)
            .attrTween("cx", function() {
              return function(t) {
                return mars_x + mars_orbit_radius * Math.cos(2 * Math.PI * t);
              }
            })
            .attrTween("cy", function() {
              return function(t) {
                return mars_y + mars_orbit_radius * Math.sin(2 * Math.PI * t);
              }
            })
            .on("end", marsOrbit); // repeat infinitely
    }
  marsOrbit();
    

  // draw stars function
  function drawStar(cx, cy, nPoints, scale, color, rotation) {
    const star = svg.append("g");

    let outerRadius = 1*scale;
    let innerRadius = .5*scale;

    let data = []
    for(let i = 0; i < nPoints * 2; i++){
        let angle = (i / (2*nPoints) * Math.PI * 2) + rotation
        let radius = i % 2 === 0 ? outerRadius : innerRadius;

        let x = Math.cos(angle) * radius + cx;
        let y = Math.sin(angle) * radius + cy;
        data.push([x, y])
    }
    data.push(0)

    let line = d3.line()
        .x(d => d[0])
        .y(d => d[1]);

    d3.select("svg")
      .append("path")
      .attr("d", line(data))
      .attr("stroke", "none")
      .attr("fill", color);
  }

  // small stars
  function generateStars() {
    let x, y;
      x = Math.random() * width;
      y = Math.random() * height;
      // Distance squared from circle center
    // } while ((x - cx) ** 2 + (y - cy) ** 2 <= 250 ** 2);
    return {x, y};
  }
  const numStars = 10;
  for (let i = 0; i < numStars; i++) { 
    const { x: star_x, y: star_y } = generateStars();
    if ((star_x-width/2) ** 2 + (star_y-height/2) ** 2 >= 350 ** 2) {
      drawStar(star_x, star_y, 5, 10, "#ffff80", 0);
    }
  }

  // big stars
  drawStar(100, 100, 5, 30, "#ffff80", 0)
  drawStar(1200, 200, 5, 30, "#ffff80", 0)
  drawStar(300, 600, 5, 30, "#ffff80", 0)

  // sun
  function drawSun() {
    drawStar(width/2, height/2, 12, 110, "#ffad33", 0)

    svg.append("circle")
      .attr("cx", width/2)
      .attr("cy", height/2)
      .attr("r", 60)
      .attr("fill", "#e6e600")
      .on("mouseover", function () {
        svg.append("text")
          .attr("id", "sun-label")
          .attr("x", 150)
          .attr("y", 350)
          .attr("text-anchor", "middle")
          .attr("font-size", "24px")
          .attr("fill", "white")
          .text("Sun");
      })
      .on("mouseout", function () {
        svg.select("#sun-label").remove();
      });
  }
  drawSun()


  // rocket ship
  function drawShip(cx, cy) {
    const ship = svg.append("g");

    ship.append("rect")
          .attr("x", 1200)
          .attr("y", 450)
          .attr("width", 90)
          .attr("height", 150)
          .attr("fill", "#808080");
    
    ship.append("polygon")
        .attr("points", "1200,450 1245,400 1290,450")
        .attr("fill", "#595959");
    ship.append("line")
            .attr("x1", 1200)
            .attr("y1", 480)
            .attr("x2", 1290)
            .attr("y2", 480)
            .attr("stroke", "#595959")
            .attr("stroke-width", 3)
            .attr("stroke-linecap", "round");
    ship.append("line")
            .attr("x1", 1200)
            .attr("y1", 475)
            .attr("x2", 1290)
            .attr("y2", 475)
            .attr("stroke", "#595959")
            .attr("stroke-width", 3)
            .attr("stroke-linecap", "round");
    ship.append("polygon")
        .attr("points", "1200,530 1180,600 1180,650 1200,600")
        .attr("fill", "#595959");
    ship.append("polygon")
        .attr("points", "1290,530 1310,600 1310,650 1290,600")
        .attr("fill", "#595959");

    ship.append("polygon")
        .attr("points", "1220,600 1270,600 1290,680    1265,650 1245,680 1225,650    1200,680")
        .attr("fill", "#ff6600");
  }
  drawShip(1200, 450);

</script>

</body>
