  const width = 1400;

  const svg = d3.select("#container")

  // earth orbit
  const earth_x = width / 2;   // center of the circle
  const earth_y = height / 2;
  const earth_orbit_radius = 230;

  // orbit ring
  svg.append("circle")
      .attr("cx", width/2)
      .attr("cy", height/2)
      .attr("r", earth_orbit_radius)
      .attr("stroke", "white")
      .attr("fill", "none");
  
  function drawEarth() {
    let earth = svg.append("g");

    earth = svg.append("circle")
                  .attr("r", 40)
                  .attr("fill", "#009900");
    
    // earth = svg.append("rect")
    //               .attr("x", 385)
    //               .attr("y", 370)
    //               .attr("width", 30)
    //               .attr("height", 50)
    //               .attr("fill", "#8D5524");

    return earth;
  }
  const earth = drawEarth()

  function earthOrbit() {
      const duration = 20000; // 20 seconds

      earth.transition()
            .duration(duration)
            .ease(d3.easeLinear)
            .attrTween("cx", function() {
              return function(t) {
                return earth_x + earth_orbit_radius * Math.cos(2 * Math.PI * t);
              }
            })
            .attrTween("cy", function() {
              return function(t) {
                return earth_y + earth_orbit_radius * Math.sin(2 * Math.PI * t);
              }
            })
            .on("end", earthOrbit); // repeat infinitely
    }
  earthOrbit();


  // mars orbit
  const mars_x = width / 2;   // center of the circle

    let mars = svg.append("g");

    mars = svg.append("circle")
                  .attr("r", 20)
                  .attr("fill", "#b30000");
  
    return mars;
  }
  const mars = drawMars()

  function marsOrbit() {
      const duration = 40000; // 20 seconds

      mars.transition()
            .duration(duration)
            .ease(d3.easeLinear)
            .attrTween("cx", function() {
              return function(t) {

              }

            .attrTween("cy", function() {

              }
            })
            .on("end", marsOrbit); // repeat infinitely
    }
  marsOrbit();
    

  // draw stars
  function drawStar(cx, cy, nPoints, scale, color) {
    const star = svg.append("g");

    let outerRadius = 1*scale;
    let innerRadius = .5*scale;

    let data = []
    for(let i = 0; i < nPoints * 2; i++){
        let angle = i / (2*nPoints) * Math.PI * 2
        let radius = i % 2 === 0 ? outerRadius : innerRadius;

        let x = Math.cos(angle) * radius + cx;
        let y = Math.sin(angle) * radius + cy;
        data.push([x, y])
    }
    data.push(0)

    let line = d3.line()
        .x(d => d[0])
        .y(d => d[1]);

    d3.select("svg")
      .append("path")
      .attr("d", line(data))
      .attr("stroke", "none")
      .attr("fill", color);
  }
